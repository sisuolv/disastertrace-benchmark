name: Offline benchmark verification
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the recorded dependency versions
        working-directory: disastertrace-starter
        run: python -m pip install -c ../handoff_validation/requirements-installed.txt -e '.[dev]'
      - name: Tests, fresh builds, calibration rehearsal and P2
        working-directory: disastertrace-starter
        run: python scripts/reproduce_next_phase.py --output work/next-phase-ci
